name: Build Update Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'manifest.json'
      - 'releases/**'

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute content hash
        id: hash
        run: |
          HASH=$(find . -type f \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path './releases/*' \
            -not -name 'manifest.json' \
            | sort | xargs sha256sum | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "计算出的版本号: $HASH"

      - name: Package site into zip
        run: |
          mkdir -p releases
          rm -f releases/*.zip
          zip -r "releases/${{ steps.hash.outputs.hash }}.zip" . \
            -x ".git/*" ".github/*" "releases/*" "manifest.json"

      - name: Write manifest.json
        run: |
          cat > manifest.json << EOF
          {
            "version": "${{ steps.hash.outputs.hash }}",
            "url": "https://liya-36j.pages.dev/releases/${{ steps.hash.outputs.hash }}.zip"
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json releases/
          git diff --staged --quiet || git commit -m "auto: update manifest to ${{ steps.hash.outputs.hash }}"
          git push
